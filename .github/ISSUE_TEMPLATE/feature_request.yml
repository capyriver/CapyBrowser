name: Feature request
description: Suggest an idea for CapyBrowser
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task you want an LLM to be able to do in the browser.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
